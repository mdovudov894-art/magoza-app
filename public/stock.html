<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-title="nav_stock">
  <header id="top"></header>
  <main class="page">
    <h1 data-i18n="nav_stock"></h1>
    <section class="alerts" id="alerts"></section>

    <section class="panel">
      <h2 data-i18n="stock_pick"></h2>
      <input type="text" id="pick" data-i18n-ph="stock_pick_ph" class="mt">
      <div id="pickList"></div>
      <div id="sel" hidden>
        <h2 class="mt" id="selName"></h2>
        <div class="cards" id="selCards"></div>

        <h3 class="mt" data-i18n="stock_receive"></h3>
        <form id="recvForm" class="filters">
          <label class="f"><span data-i18n="qty"></span><input type="number" id="rQty" min="0.001" step="any" required></label>
          <label class="f"><span data-i18n="expiry"></span><input type="date" id="rExp"></label>
          <label class="f"><span data-i18n="batch_no"></span><input type="text" id="rBatch"></label>
          <label class="f"><span data-i18n="supplier"></span><input type="text" id="rSup"></label>
          <label class="f"><span data-i18n="cost"></span><input type="number" id="rCost" min="0" step="0.01"></label>
          <button type="submit" class="btn primary" data-i18n="stock_receive_btn"></button>
        </form>

        <h3 class="mt" data-i18n="stock_batches"></h3>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th data-i18n="batch_no"></th><th data-i18n="received"></th><th data-i18n="expiry"></th><th class="num" data-i18n="qty"></th><th data-i18n="supplier"></th><th></th></tr></thead>
          <tbody id="batches"></tbody>
        </table></div>

        <h3 class="mt" data-i18n="stock_moves"></h3>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th data-i18n="date"></th><th data-i18n="type"></th><th class="num" data-i18n="qty"></th><th data-i18n="user"></th><th data-i18n="note"></th></tr></thead>
          <tbody id="moves"></tbody>
        </table></div>
      </div>
    </section>
  </main>
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/stock.js"></script>
</body>
</html>
